services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webshop-frontend
    restart: unless-stopped
    ports:
      - "4200:8080"
    depends_on:
      - backend
    networks:
      - web

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webshop-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/prototype_webshop_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: prototype_webshop_db
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    driver: bridge